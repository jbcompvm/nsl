<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Pilot-to-Production Gap Icon -->
  <!-- Represents: experiment/prototype (left) → gap → production (right) -->

  <!-- Left side: Flask/Lab (prototype) -->
  <path d="M18 12h4v8l-6 12v8a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-8l-6-12v-8"
        stroke="url(#grad1)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Gap indicator: broken/dashed connection -->
  <path d="M26 32h4M34 32h4"
        stroke="#6b6b7a"
        stroke-width="2"
        stroke-linecap="round"
        stroke-dasharray="2 3"/>

  <!-- Right side: Server/Production (gears/system) -->
  <circle cx="48" cy="32" r="9"
          stroke="url(#grad2)"
          stroke-width="2.5"
          fill="none"/>
  <path d="M48 26v12M42 32h12"
        stroke="url(#grad2)"
        stroke-width="2"
        stroke-linecap="round"/>
  <circle cx="48" cy="32" r="3"
          fill="#14b8a6"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
