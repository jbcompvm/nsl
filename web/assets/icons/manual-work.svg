<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Manual Work Icon -->
  <!-- Represents: person doing repetitive work that should be automated -->

  <!-- Person silhouette with repetitive task symbols -->
  <circle cx="24" cy="16" r="6"
          stroke="url(#grad3)"
          stroke-width="2.5"
          fill="none"/>

  <!-- Body/shoulders -->
  <path d="M16 28c0-4 3.5-6 8-6s8 2 8 6"
        stroke="url(#grad3)"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Stack of repetitive documents/tasks -->
  <rect x="38" y="20" width="18" height="24" rx="2"
        stroke="#f59e0b"
        stroke-width="2"
        fill="none"/>
  <line x1="42" y1="26" x2="52" y2="26"
        stroke="#f59e0b"
        stroke-width="1.5"
        stroke-linecap="round"/>
  <line x1="42" y1="32" x2="52" y2="32"
        stroke="#f59e0b"
        stroke-width="1.5"
        stroke-linecap="round"/>
  <line x1="42" y1="38" x2="52" y2="38"
        stroke="#f59e0b"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Repetition indicator (copy layers) -->
  <rect x="40" y="18" width="18" height="24" rx="2"
        stroke="#f59e0b"
        stroke-width="1.5"
        fill="none"
        opacity="0.4"/>
  <rect x="42" y="16" width="18" height="24" rx="2"
        stroke="#f59e0b"
        stroke-width="1"
        fill="none"
        opacity="0.2"/>

  <!-- Arrow from person to tasks -->
  <path d="M30 28l5 2"
        stroke="#14b8a6"
        stroke-width="2"
        stroke-linecap="round"/>

  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
