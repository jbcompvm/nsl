<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradient for neural connections -->
    <linearGradient id="neuralGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.15" />
    </linearGradient>

    <!-- Glow filter for nodes -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base transparent background -->
  <rect width="1440" height="800" fill="transparent"/>

  <!-- Neural network connections (subtle lines) -->
  <g opacity="0.3" stroke="url(#neuralGradient)" stroke-width="1" fill="none">
    <!-- Layer 1 to Layer 2 connections -->
    <path d="M 200,150 Q 400,200 600,180"/>
    <path d="M 200,150 Q 400,300 600,350"/>
    <path d="M 200,350 Q 400,300 600,180"/>
    <path d="M 200,350 Q 400,400 600,350"/>
    <path d="M 200,550 Q 400,500 600,350"/>
    <path d="M 200,550 Q 400,600 600,520"/>

    <!-- Layer 2 to Layer 3 connections -->
    <path d="M 600,180 Q 800,250 1000,200"/>
    <path d="M 600,180 Q 800,300 1000,400"/>
    <path d="M 600,350 Q 800,300 1000,200"/>
    <path d="M 600,350 Q 800,400 1000,400"/>
    <path d="M 600,520 Q 800,450 1000,400"/>
    <path d="M 600,520 Q 800,550 1000,580"/>

    <!-- Layer 3 to Output connections -->
    <path d="M 1000,200 Q 1150,300 1280,350"/>
    <path d="M 1000,400 Q 1150,380 1280,350"/>
    <path d="M 1000,580 Q 1150,450 1280,350"/>
  </g>

  <!-- Neural nodes (subtle circles) -->
  <g filter="url(#glow)">
    <!-- Input layer -->
    <circle cx="200" cy="150" r="6" fill="#14b8a6" opacity="0.4"/>
    <circle cx="200" cy="350" r="6" fill="#14b8a6" opacity="0.4"/>
    <circle cx="200" cy="550" r="6" fill="#14b8a6" opacity="0.4"/>

    <!-- Hidden layer 1 -->
    <circle cx="600" cy="180" r="5" fill="#2dd4bf" opacity="0.35"/>
    <circle cx="600" cy="350" r="5" fill="#2dd4bf" opacity="0.35"/>
    <circle cx="600" cy="520" r="5" fill="#2dd4bf" opacity="0.35"/>

    <!-- Hidden layer 2 -->
    <circle cx="1000" cy="200" r="5" fill="#60a5fa" opacity="0.35"/>
    <circle cx="1000" cy="400" r="5" fill="#60a5fa" opacity="0.35"/>
    <circle cx="1000" cy="580" r="5" fill="#60a5fa" opacity="0.35"/>

    <!-- Output layer -->
    <circle cx="1280" cy="350" r="7" fill="#3b82f6" opacity="0.45"/>
  </g>

  <!-- Floating geometric shapes for visual interest -->
  <g opacity="0.08" fill="none" stroke="#fff" stroke-width="1.5">
    <!-- Abstract geometric patterns -->
    <path d="M 100,100 L 140,140 L 100,180 L 60,140 Z"/>
    <circle cx="1350" cy="150" r="30"/>
    <path d="M 1300,650 L 1340,690 L 1300,730 L 1260,690 Z"/>
    <circle cx="100" cy="700" r="25"/>

    <!-- Small accent dots -->
    <circle cx="450" cy="100" r="15" opacity="0.5"/>
    <circle cx="950" cy="120" r="12" opacity="0.5"/>
    <circle cx="350" cy="680" r="18" opacity="0.5"/>
    <circle cx="1100" cy="720" r="14" opacity="0.5"/>
  </g>

  <!-- Subtle grid pattern for depth -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="200" x2="1440" y2="200"/>
    <line x1="0" y1="400" x2="1440" y2="400"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="360" y1="0" x2="360" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/>
  </g>
</svg>
